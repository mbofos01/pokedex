x-wharfmap:
  backgroundColor: "#e3c99d"
  backgroundBorderColor: "#000000"
  backgroundBorderWidth: 2
  profiles:
    setup:
      color: "#E8F5E9"
      border-color: "#2E7D32"
      border-width: "2px"
    classifier:
      color: "#FFF3E0"
      border-color: "#7b00e6"
      border-width: "2px"
  conditions:
    service_healthy:
      # stroke: "#000000ff"
      stroke-width: "2px"
      stroke-dasharray: "5 5"
      # color: "#000000ff"

services:
  postgres:
    image: postgres:15
    command: [ "postgres", "-c", "logging_collector=off", "-c", "log_statement=none", "-c", "log_min_messages=fatal" ]
    container_name: pkmn-db
    env_file:
      - .env
      - .env.postgres
    ports:
      - "5432:5432"
    volumes:
      - pkmn_data:/var/lib/postgresql/data
      - ./database-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U pkmn -d pokedex'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web
    x-wharfmap:
      color: "#BBDEFB"
      border-color: "#1976D2"
      border-width: "3px"
      border-style: "dashed"

  pkmn-fetcher:
    build: pkmn-data-retrieval/.
    container_name: pkmn-fetcher
    restart: "no"
    profiles:
      - setup
    volumes:
      - ./pkmn-data-retrieval/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy # Wait for PostgreSQL to be ready
    networks:
      - web
    x-wharfmap:
      color: "#C8E6C9"
      border-color: "#388E3C"
      border-width: "3px"

  kafka:
    image: confluentinc/cp-kafka:7.9.1
    container_name: kafka
    restart: unless-stopped
    env_file:
      - .env
      - .env.kafka
    volumes:
      - ./custom-log4j.properties:/app/kafka-log4j.properties:ro
    ports:
      - "29092:29092"
    profiles:
      - classifier
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - web
    x-wharfmap:
      color: "#FFCCBC"
      border-color: "#E64A19"
      border-width: "3px"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.1
    container_name: schema-registry
    restart: unless-stopped
    profiles:
      - classifier
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
      - .env.schema-registry
    volumes:
      - ./schema-registry-logging.properties:/etc/schema-registry/logging.properties:ro
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - web


  pkmn-api:
    build:
      context: .
      dockerfile: pkmn-api/Dockerfile
    container_name: pkmn-api
    restart: on-failure:3
    profiles:
      - classifier
    env_file:
      - .env
      - .env.pkmn-api
    ports:
      - "8000:8000"
    volumes:
      - ./pkmn-api/src:/app/src
      - ./schemas:/app/schemas:ro
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30m   # extremely long → practically never repeats
      timeout: 20s
      retries: 5
      start_period: 1s
    networks:
      - web
    x-wharfmap:
      color: "#FFE082"
      border-color: "#F57C00"
      border-width: "3px"

  pkmn-classifier:
    build:
      context: .
      dockerfile: pkmn-classifier/Dockerfile
    container_name: pkmn-classifier
    restart: on-failure:3
    profiles:
      - classifier
    env_file:
      - .env
      - .env.pkmn-classifier
    volumes:
      - ./pkmn-classifier/src:/app/src
      - ./pkmn-classifier/test:/app/test
      - ./schemas:/app/schemas:ro
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - web
    x-wharfmap:
      color: "#C5CAE9"
      border-color: "#303F9F"
      border-width: "3px"

  pkmn-enhancement:
    build:
      context: .
      dockerfile: pkmn-enhancement/Dockerfile
    container_name: pkmn-enhancement
    restart: on-failure:3
    profiles:
      - classifier
    env_file:
      - .env
      - .env.pkmn-enhancement
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    volumes:
      - ./schemas:/app/schemas:ro
    networks:
      - web

  pkmn-metrics:
    build:
      context: .
      dockerfile: pkmn-metrics/Dockerfile
    container_name: pkmn-metrics
    restart: on-failure:3
    profiles:
      - classifier
    env_file:
      - .env
      - .env.pkmn-metrics
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    volumes:
      - ./schemas:/app/schemas:ro
      - ./pkmn-metrics/src:/app/src
    networks:
      - web
    x-wharfmap:
      color: "#D1C4E9"
      border-color: "#6A1B9A"
      border-width: "3px"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles:
      - classifier
    ports:
      - "8080:8080"
    env_file:
      - .env
      - .env.kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - web 
    x-wharfmap:
      color: "#E3F2FD"
      border-color: "#1976D2"
      border-width: "3px"

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    profiles:
      - classifier
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      pkmn-api:
        condition: service_healthy
    networks:
      - web
    x-wharfmap:
      color: "#FFF9C4"
      border-color: "#F57F17"
      border-width: "3px"

  ngrok:
    build:
      context: .
      dockerfile: Dockerfile.ngrok
    container_name: ngrok
    profiles:
      - classifier
    command: http nginx:80 --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      nginx:
        condition: service_started
    networks:
      - web
    x-wharfmap:
      color: "#D1C4E9"
      border-color: "#512DA8"
      border-width: "3px"

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9443:9443"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    command: --log-level=ERROR
    networks:
      - web
    x-wharfmap:
      color: "#E1F5FE"
      border-color: "#0c4667ff"
      border-width: "3px"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    profiles:
      - classifier
    ports:
      - "3000:3000"
    env_file:
      - .env
      - .env.grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - web
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    x-wharfmap:
      color: "#cc382b76"
      border-color: "#E65100"
      border-width: "3px"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - web
    entrypoint: sh -c "echo 'Welcome to Node Exporter!' && exec /bin/node_exporter --path.rootfs=/host --log.level=error"
    volumes:
      - /:/host:ro
    x-wharfmap:
      color: "#B2DFDB"
      border-color: "#00897B"
      border-width: "3px"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles:
      - classifier
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - web
    depends_on:
      node-exporter:
        condition: service_started
      pkmn-metrics:
        condition: service_started
    entrypoint: sh -c "echo 'Welcome to Prometheus!' && exec /bin/prometheus --config.file=/prometheus/prometheus.yml --log.level=error"
    x-wharfmap:
      color: "#F8BBD0"
      border-color: "#AD1457"
      border-width: "3px"

volumes:
  pkmn_data:
  portainer_data:
  grafana_data:

networks:
  web:
    driver: bridge
