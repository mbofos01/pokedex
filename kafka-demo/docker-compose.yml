services:
  kafka:
    image: confluentinc/cp-kafka:7.9.1
    container_name: demo-kafka
    restart: unless-stopped
    profiles:
      - kafka
    environment:
      # KRaft mode: no Zookeeper, this single node is both broker and controller
      CLUSTER_ID: kafka-demo-cluster-1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:SSL,EXTERNAL:SSL,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENERS: BROKER://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # default TRACE-level state-change logging noticeably slows broker startup
      KAFKA_LOG4J_ROOT_LOGLEVEL: "WARN"
      KAFKA_LOG4J_LOGGERS: "kafka.controller=ERROR,state.change.logger=ERROR"
      # mutual TLS on both client-facing listeners; must be set per-listener since
      # their names aren't literally "SSL" (the generic KAFKA_SSL_* vars only apply
      # to a listener named "SSL"). CONTROLLER stays plaintext: single-node, not
      # client-facing, never leaves the container network.
      KAFKA_LISTENER_NAME_BROKER_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.keystore.jks
      KAFKA_LISTENER_NAME_BROKER_SSL_KEYSTORE_PASSWORD: ${CERT_PASSWORD}
      KAFKA_LISTENER_NAME_BROKER_SSL_KEY_PASSWORD: ${CERT_PASSWORD}
      KAFKA_LISTENER_NAME_BROKER_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.jks
      KAFKA_LISTENER_NAME_BROKER_SSL_TRUSTSTORE_PASSWORD: ${CERT_PASSWORD}
      KAFKA_LISTENER_NAME_BROKER_SSL_CLIENT_AUTH: required
      KAFKA_LISTENER_NAME_BROKER_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.keystore.jks
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_KEYSTORE_PASSWORD: ${CERT_PASSWORD}
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_KEY_PASSWORD: ${CERT_PASSWORD}
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.jks
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_TRUSTSTORE_PASSWORD: ${CERT_PASSWORD}
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_CLIENT_AUTH: required
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
    volumes:
      - ./certs:/etc/kafka/secrets:ro
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - kafka-demo

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.1
    container_name: demo-schema-registry
    restart: unless-stopped
    profiles:
      - kafka
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: SSL://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: https://0.0.0.0:8081
      SCHEMA_REGISTRY_INTER_INSTANCE_PROTOCOL: https
      # mTLS to the broker
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SSL
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEYSTORE_LOCATION: /etc/schema-registry/secrets/schema-registry.keystore.jks
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEYSTORE_PASSWORD: ${CERT_PASSWORD}
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEY_PASSWORD: ${CERT_PASSWORD}
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_LOCATION: /etc/schema-registry/secrets/schema-registry.truststore.jks
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_PASSWORD: ${CERT_PASSWORD}
      SCHEMA_REGISTRY_KAFKASTORE_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      # mTLS for its own HTTPS listener (require client certs from callers)
      SCHEMA_REGISTRY_SSL_KEYSTORE_LOCATION: /etc/schema-registry/secrets/schema-registry.keystore.jks
      SCHEMA_REGISTRY_SSL_KEYSTORE_PASSWORD: ${CERT_PASSWORD}
      SCHEMA_REGISTRY_SSL_KEY_PASSWORD: ${CERT_PASSWORD}
      SCHEMA_REGISTRY_SSL_TRUSTSTORE_LOCATION: /etc/schema-registry/secrets/schema-registry.truststore.jks
      SCHEMA_REGISTRY_SSL_TRUSTSTORE_PASSWORD: ${CERT_PASSWORD}
      SCHEMA_REGISTRY_SSL_CLIENT_AUTH: "true"
    volumes:
      - ./certs:/etc/schema-registry/secrets:ro
    ports:
      - "8081:8081"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-k",
          "--cert",
          "/etc/schema-registry/secrets/client-cert.pem",
          "--key",
          "/etc/schema-registry/secrets/client-key.pem",
          "-f",
          "https://localhost:8081/subjects",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - kafka-demo

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: demo-kafka-ui
    restart: unless-stopped
    profiles:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_LOCATION: /kafka-ui/certs/kafka-ui.keystore.jks
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_PASSWORD: ${CERT_PASSWORD}
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEY_PASSWORD: ${CERT_PASSWORD}
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /kafka-ui/certs/kafka-ui.truststore.jks
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: ${CERT_PASSWORD}
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: https://schema-registry:8081
      KAFKA_CLUSTERS_0_SCHEMAREGISTRYSSL_KEYSTORELOCATION: /kafka-ui/certs/kafka-ui.keystore.jks
      KAFKA_CLUSTERS_0_SCHEMAREGISTRYSSL_KEYSTOREPASSWORD: ${CERT_PASSWORD}
      KAFKA_CLUSTERS_0_SCHEMAREGISTRYSSL_TRUSTSTORELOCATION: /kafka-ui/certs/kafka-ui.truststore.jks
      KAFKA_CLUSTERS_0_SCHEMAREGISTRYSSL_TRUSTSTOREPASSWORD: ${CERT_PASSWORD}
      # kafka-ui's HTTP client for schema registry calls only trusts the JVM's
      # default trust store, not the schemaRegistrySsl config above
      JAVA_OPTS: >-
        -Djavax.net.ssl.trustStore=/kafka-ui/certs/kafka-ui.truststore.jks
        -Djavax.net.ssl.trustStorePassword=${CERT_PASSWORD}
    volumes:
      - ./certs:/kafka-ui/certs:ro
    depends_on:
      schema-registry:
        condition: service_healthy
    networks:
      - kafka-demo

  cert-gen:
    image: confluentinc/cp-kafka:7.9.1
    container_name: demo-cert-gen
    profiles:
      - certs
    environment:
      CERT_PASSWORD: ${CERT_PASSWORD}
    volumes:
      - ./certs:/certs
    working_dir: /certs
    entrypoint: ["bash", "generate-certs.sh"]

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: demo-producer
    restart: on-failure:5
    profiles:
      - producer
    env_file:
      - ./producer/.env
    environment:
      # override .env host-machine defaults with in-network hostnames
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: https://schema-registry:8081
      SECURITY_PROTOCOL: ssl
      SSL_CA_LOCATION: /app/certs/ca-cert.pem
      SSL_CERTIFICATE_LOCATION: /app/certs/client-cert.pem
      SSL_KEY_LOCATION: /app/certs/client-key.pem
      # otherwise print() output sits in Python's stdout buffer instead of reaching docker logs
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./certs:/app/certs:ro
    networks:
      - kafka-demo

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: demo-consumer
    restart: on-failure:5
    profiles:
      - consumer
    env_file:
      - ./consumer/.env
    environment:
      # override .env host-machine defaults with in-network hostnames
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: https://schema-registry:8081
      SECURITY_PROTOCOL: ssl
      SSL_CA_LOCATION: /app/certs/ca-cert.pem
      SSL_CERTIFICATE_LOCATION: /app/certs/client-cert.pem
      SSL_KEY_LOCATION: /app/certs/client-key.pem
      # otherwise print() output sits in Python's stdout buffer instead of reaching docker logs
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./certs:/app/certs:ro
    networks:
      - kafka-demo

networks:
  kafka-demo:
    driver: bridge
