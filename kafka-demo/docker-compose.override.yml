# Local development convenience only — automatically merged by `docker compose`
# alongside docker-compose.yml. Not used in production; images there are immutable
# and built from the committed source (see producer/Dockerfile, consumer/Dockerfile).
services:
  producer:
    volumes:
      - ./schemas:/app/schemas:ro
      - ./producer/producer.py:/app/producer/producer.py:ro

  consumer:
    volumes:
      - ./consumer/consumer.py:/app/consumer/consumer.py:ro
